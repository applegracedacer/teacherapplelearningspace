
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Teacher Apple's EduSpace</title>

<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

<style>
:root {
    --green: #008f5a;
    --dark-green: #006b45;
    --light-green: #e5f5ed;
    --white: #ffffff;
    --dark: #183c2d;
    --muted: #668276;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Nunito', sans-serif;
    background: linear-gradient(135deg, #ffffff, #e5f5ed);
    color: var(--dark);
    min-height: 100vh;
}

/* WELCOME POP-UP */
.modal {
    position: fixed;
    inset: 0;
    background: rgba(0, 45, 28, 0.65);
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
    z-index: 1000;
}

.modal-content {
    background: var(--white);
    width: 100%;
    max-width: 520px;
    padding: 45px 35px;
    border-radius: 28px;
    text-align: center;
    box-shadow: 0 15px 45px rgba(0, 80, 50, 0.2);
    border: 3px solid var(--light-green);
}

.apple {
    font-size: 65px;
    margin-bottom: 15px;
}

.modal-content h2 {
    font-family: 'Fredoka', sans-serif;
    font-size: 35px;
    font-weight: 700;
    color: var(--dark-green);
    line-height: 1.15;
    margin-bottom: 18px;
}

.modal-content p {
    font-size: 17px;
    line-height: 1.7;
    color: var(--muted);
    margin-bottom: 28px;
}

.start-btn {
    background: var(--green);
    color: var(--white);
    border: none;
    padding: 15px 32px;
    border-radius: 30px;
    font-family: 'Nunito', sans-serif;
    font-size: 16px;
    font-weight: 900;
    cursor: pointer;
    transition: 0.3s;
}

.start-btn:hover {
    background: var(--dark-green);
    transform: translateY(-3px);
}

/* TOP NAVIGATION */
.top-bar {
    background: var(--dark-green);
    color: var(--white);
    padding: 12px 5%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 15px;
    flex-wrap: wrap;
}

.top-bar a {
    color: var(--white);
    text-decoration: none;
    font-weight: 800;
    margin-right: 15px;
    font-size: 14px;
}

.top-bar a:hover {
    color: #b9f2d5;
}

.social-links {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
}

/* SEARCH BAR */
.search-box {
    padding: 10px 16px;
    border: 2px solid #b9e5ce;
    border-radius: 25px;
    outline: none;
    font-family: 'Nunito', sans-serif;
    font-size: 14px;
    width: 220px;
}

/* MAIN CONTENT */
.container {
    max-width: 1200px;
    margin: auto;
    padding: 85px 20px;
    text-align: center;
}

.main-heading {
    font-family: 'Fredoka', sans-serif;
    font-size: clamp(42px, 7vw, 85px);
    font-weight: 700;
    color: var(--dark-green);
    line-height: 1.1;
    margin-bottom: 18px;
}

.subtitle {
    color: var(--muted);
    font-size: 21px;
    font-weight: 800;
    margin-bottom: 50px;
}

/* FOOTER */
footer {
    text-align: center;
    padding: 25px 15px;
    color: var(--dark-green);
    font-weight: 800;
    background: var(--white);
    border-top: 2px solid var(--light-green);
    margin-top: 80px;
}

/* MOBILE RESPONSIVENESS */
@media (max-width: 650px) {
    .top-bar {
        justify-content: center;
        text-align: center;
    }

    .social-links {
        justify-content: center;
    }

    .top-bar a {
        margin: 5px;
    }

    .search-box {
        width: 100%;
        max-width: 280px;
    }

    .container {
        padding: 65px 15px;
    }

    .subtitle {
        font-size: 17px;
    }

    .modal-content {
        padding: 35px 22px;
    }

    .modal-content h2 {
        font-size: 29px;
    }
}
</style>
</head>

<body>

<!-- WELCOME POP-UP -->
<div class="modal" id="welcomeModal">
    <div class="modal-content">
        <div class="apple">🍎</div>

        <h2>WELCOME TO MY LEARNING SPACE</h2>

        <p>
            Enjoy FREE interactive learning materials and educational games
            specially created for your classroom! 🌿
        </p>

        <button class="start-btn" onclick="closeModal()">
            START LEARNING ➔
        </button>
    </div>
</div>

<!-- TOP NAVIGATION -->
<div class="top-bar">
    <div class="social-links">
        <a href="#">Help</a>
        <a href="#">Facebook</a>
        <a href="#">Instagram</a>
        <a href="#">YouTube</a>
        <a href="#">Blog</a>
    </div>

    <input
        type="text"
        class="search-box"
        placeholder="Search learning materials..."
    >
</div>

<!-- MAIN CONTENT -->
<main class="container">
    <h1 class="main-heading">TEACHER APPLE'S EDUSPACE</h1>

    <p class="subtitle">
        Interactive Classroom Games & Learning Materials 🌿
    </p>
</main>

<!-- FOOTER -->
<footer>
    Made with ❤️ by Teacher Apple
</footer>

<script>
function closeModal() {
    document.getElementById("welcomeModal").style.display = "none";
}
</script>

</body>
</html>
